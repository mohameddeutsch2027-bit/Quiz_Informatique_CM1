<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz Informatique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&family=DM+Mono:wght@400;500&family=ADLaM+Display&family=Fredoka:wght@600&display=swap">
<style>
/* Layout: one question at a time on a Seyès-ruled page (school exercise book), forward-only navigation */
:root {
  --paper: #19191d;
  --ink: #f1f1f4;
  --muted: #a9a9b6;
  --rule: #2c2c33;
  --margin: #ff7a45;
  --accent: #8fb4ff;
  --accent-ink: #14151a;
  --go1: #7a1fd6;
  --go2: #d11a8f;
  --card: #26272d;
  --border: #414144;
  --soft: #31323a;
  --bad: #ff7b72;
  --good: #4ade80;
  --qcolor: #8fb4ff;
  --label: #ff8fc8;
  --t-red: #ff5a4d;
  --t-green: #3ddc84;
  --clock: #3be07a;
  --clock-ink: #5ff29a;
  --bg1: #19191d;
  --bg2: #1c1c21;
  --bg3: #19191d;
  --on-bg: #f1f1f4;
  --on-bg-soft: #b9b9c6;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="dark"] {
  --paper: #150b2e; --ink: #f1e9ff; --muted: #b9a8e0; --rule: #2a1a52; --margin: #ffd400;
  --accent: #c9a0ff; --accent-ink: #1a0b3a; --go1: #c9a0ff; --go2: #ff9ad5;
  --card: #1f1240; --border: #3d2a74; --soft: #2a1a58;
  --bad: #ff8a80; --good: #6fd6a0; --qcolor: #9db4ff; --label: #ff9ad5; --t-red: #ff6b6b; --t-green: #4ade80; --clock: #3be07a; --clock-ink: #5ff29a;
  --bg1: #1b0a45; --bg2: #5a0f6e; --bg3: #b04a12; --on-bg: #ffffff; --on-bg-soft: rgba(255,255,255,.9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg1);
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
  background-size: 100% 28px, 112px 100%, 100% 100%;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }

header { display: grid; gap: 4px; padding-left: 14px; border-left: 3px solid var(--margin); text-align: center; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { color: var(--on-bg); font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 5.5vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
h1.t-red { color: var(--t-red); }
h1.t-green { color: var(--t-green); }
.level { justify-self: center; font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .04em; color: #ffffff; background: linear-gradient(135deg, #1f78e8 0%, #1a2fc4 100%); padding: 4px 18px; border-radius: 999px; margin-top: 4px; }
.who { font-size: 15px; color: var(--on-bg-soft); font-weight: 700; }

.progress { display: grid; gap: 8px; margin-bottom: 20px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--on-bg); font-weight: 500; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.08); border: 1px solid #414144; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--go1), var(--go2)); transition: width .25s ease; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); padding: 24px; display: grid; gap: 18px; min-width: 0; }
.art { justify-self: center; width: min(230px, 75%); height: auto; }
.tag { justify-self: start; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--soft); padding: 4px 10px; border-radius: 4px; }
.q { text-align: center; color: var(--qcolor); font-family: "ADLaM Display", var(--font-display); font-weight: 400; font-size: clamp(21px, 4.2vw, 26px); line-height: 1.25; margin: 0; text-wrap: balance; outline: none; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.clockbox { display: flex; align-items: center; gap: 10px; }
.tnum { font-family: var(--font-mono); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; color: var(--clock-ink); min-width: 3.2ch; text-align: right; }
.clock { display: block; line-height: 0; }
.clock svg { display: block; width: 84px; height: 84px; }
.clock .face { fill: var(--soft); stroke: var(--ink); stroke-width: 3; }
.clock .ticks line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.clock .arc { stroke: var(--clock); stroke-linecap: butt; }
.clock .track { stroke: var(--clock); opacity: .18; }
.clock .hand { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.clock .pin { fill: var(--ink); }
.clockbox.low .arc { stroke: var(--bad); }
.clockbox.low .tnum { color: var(--bad); }
.foot.split { justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
button.ghost { font: inherit; font-weight: 700; background: transparent; color: var(--accent); border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 18px; cursor: pointer; }
button.ghost:hover { border-color: var(--accent); }
button.ghost:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.pic { background: #ffffff; padding: 6px; justify-self: center; width: auto; max-width: 100%; max-height: 180px; border-radius: 14px; }
p.hint, p.hint b, p.hint span { color: #ffe14d; font-weight: 800; font-size: 17px; opacity: 1; }
.hint { text-align: center; margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.lead { margin: 0; color: var(--muted); }

.field { display: grid; gap: 6px; }
.field label { font-family: "Fredoka", var(--font-display); font-weight: 600; font-size: 21px; color: var(--label); }
.field input { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 14px; width: 100%; min-width: 0; }
.field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.err { margin: 0; color: var(--bad); font-size: 15px; min-height: 1.4em; }

.explorer { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--paper); font-size: 14px; }
.explorer .titlebar { background: var(--accent); color: var(--accent-ink); padding: 6px 12px; font-weight: 700; font-size: 13px; }
.explorer .addr { padding: 6px 12px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
.explorer .tbl { overflow-x: auto; }
.explorer table { border-collapse: collapse; width: 100%; min-width: 420px; }
.explorer th { text-align: left; font-weight: 700; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.explorer td { padding: 6px 12px; border-bottom: 1px solid var(--rule); }
.explorer td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; min-width: 0; }
.options.row { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.opt { position: relative; display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--card); min-width: 0; transition: border-color .12s, background .12s; }
.opt:hover { border-color: #38bdf8; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.mark { flex: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }
.multi .mark { border-radius: 4px; }
.mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-ink); transform: scale(0); transition: transform .12s; }
.multi .mark::after { border-radius: 2px; }
.opt.on { border-color: #38bdf8; background: rgba(56,189,248,.22); box-shadow: 0 0 0 1px #38bdf8; }
.opt.on .txt { color: #ffffff; font-weight: 700; }
.opt.on .mark { background: #38bdf8; border-color: #38bdf8; }
.opt.on .mark::after { transform: scale(1); background: #0b1220; }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .txt { overflow-wrap: anywhere; }
.symbol .txt { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
.symbol .opt { justify-content: center; }

.foot { display: flex; justify-content: flex-end; }
button.go { font: inherit; font-weight: 700; background: linear-gradient(135deg, #e63a06 0%, #81280e 100%); color: #ffffff; border: 0; border-radius: 8px; padding: 12px 24px; cursor: pointer; }
button.go.blue { background: linear-gradient(135deg, #e63a06 0%, #81280e 100%); color: #ffffff; }
button.go:disabled { opacity: .45; cursor: not-allowed; }
button.go:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.result { gap: 20px; }
.result .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.emoji { font-size: clamp(56px, 14vw, 84px); line-height: 1; }
.rname { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 5vw, 30px); line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { border: 1.5px solid var(--border); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; background: var(--paper); }
.stat span { font-size: 13px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .05em; }
.stat b { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.good b { color: var(--good); }
.stat.bad b { color: var(--bad); }
.stat.final { border-color: var(--accent); background: var(--soft); }
.stat.final small { font-size: .5em; color: var(--muted); font-weight: 600; }
.result p { margin: 0; }
.revtitle { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 4px 0 0; }
.rev { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rev li { border: 1.5px solid var(--border); border-left-width: 6px; border-radius: 8px; padding: 12px 14px; background: var(--paper); display: grid; gap: 6px; min-width: 0; }
.rev li.ok { border-left-color: var(--good); }
.rev li.ko { border-left-color: var(--bad); }
.rev .rq { font-weight: 700; overflow-wrap: anywhere; }
.rev .line { display: flex; gap: 10px; align-items: baseline; overflow-wrap: anywhere; min-width: 0; }
.rev .lab { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); flex: none; min-width: 108px; }
.rev .good { color: var(--good); font-weight: 700; }
.rev .bad { color: var(--bad); font-weight: 700; }

@media (max-width: 480px) {
  .card { padding: 18px; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Thème bleu (couleurs de référence : #354ba1, #1f3996, #1c378e, #f4f5fa, #e3e5f2) */
:root:root:root {
  --bg1: #354ba1; --bg2: #2a409a; --bg3: #1f3996; --on-bg: #ffffff; --on-bg-soft: rgba(255,255,255,.95);
  --paper: #e3e5f2; --ink: #1a2a6c; --muted: #4a5a99; --rule: #c9cfe8; --margin: #ffffff;
  --accent: #1c378e; --accent-ink: #ffffff; --card: #f4f5fa; --border: #b9c1e0; --soft: #e3e5f2;
  --bad: #b3261e; --good: #14783f; --qcolor: #1c378e; --label: #1f3996;
  --t-red: #ff5a4d; --t-green: #3ddc84; --clock: #16a34a; --clock-ink: #138a3f; color-scheme: light;
}
h1.t-red, h1.t-green { -webkit-text-stroke: 7px #0e1b4d; paint-order: stroke fill; text-shadow: 0 3px 10px rgba(0,0,0,.3); }
.level { box-shadow: 0 0 0 2px #ffffff; }
.bar { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.6); }
.bar > i { background: #ffffff; }
.card { box-shadow: 0 12px 30px rgba(10,20,70,.4); border-color: #1c378e; }
.field input { background: #e3e5f2; color: #1a2a6c; border-color: #1c378e; }
p.hint, p.hint b, p.hint span { color: #c01818; }
.opt:hover { border-color: #1c378e; }
.opt.on { border-color: #1c378e; background: #d3dbf6; box-shadow: 0 0 0 1px #1c378e; }
.opt.on .txt { color: #12206b; }
.opt.on .mark { background: #1c378e; border-color: #1c378e; }
.opt.on .mark::after { background: #ffffff; }
button.go, button.go.blue { background: linear-gradient(135deg, #2f4fb8 0%, #1c378e 100%); box-shadow: 0 3px 0 #12266a; }
.clock .face { fill: #ffffff; }
</style>

<div class="wrap">
  <header>
    <h1 class="t-red">Quiz</h1>
    <h1 class="t-green">Informatique</h1>
    <span class="level">Niveau&nbsp;: CM1</span>
    <span class="who" id="who" hidden></span>
  </header>

  <section id="intro" class="card">
    <svg class="art" viewBox="0 0 230 130" role="img" aria-label="Ordinateur : écran, unité centrale, clavier et souris" xmlns="http://www.w3.org/2000/svg">
      <g stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="22" y="8" width="112" height="76" rx="8" fill="var(--card)"/>
        <rect x="30" y="16" width="96" height="58" rx="3" fill="var(--soft)" stroke-width="2"/>
        <rect x="82" y="84" width="16" height="10" fill="var(--card)"/>
        <rect x="64" y="94" width="52" height="7" rx="3.5" fill="var(--card)"/>
        <rect x="152" y="22" width="52" height="80" rx="6" fill="var(--card)"/>
        <line x1="160" y1="34" x2="196" y2="34" stroke-width="2.5"/>
        <line x1="160" y1="42" x2="196" y2="42" stroke-width="2.5"/>
        <circle cx="178" cy="82" r="7" fill="var(--accent)"/>
        <rect x="14" y="108" width="124" height="16" rx="4" fill="var(--card)"/>
        <rect x="156" y="106" width="16" height="20" rx="8" fill="var(--card)"/>
        <line x1="164" y1="106" x2="164" y2="114" stroke-width="2"/>
      </g>
      <g fill="var(--accent)">
        <rect x="38" y="24" width="40" height="5" rx="2.5"/>
        <rect x="38" y="36" width="64" height="4" rx="2" opacity=".45"/>
        <rect x="38" y="45" width="52" height="4" rx="2" opacity=".45"/>
        <rect x="38" y="56" width="10" height="12" rx="2"/>
        <rect x="52" y="50" width="10" height="18" rx="2"/>
        <rect x="66" y="43" width="10" height="25" rx="2"/>
      </g>
      <g fill="var(--muted)"><rect x="21" y="113" width="8" height="3" rx="1.5"/><rect x="33" y="113" width="8" height="3" rx="1.5"/><rect x="45" y="113" width="8" height="3" rx="1.5"/><rect x="57" y="113" width="8" height="3" rx="1.5"/><rect x="69" y="113" width="8" height="3" rx="1.5"/><rect x="81" y="113" width="8" height="3" rx="1.5"/><rect x="93" y="113" width="8" height="3" rx="1.5"/><rect x="105" y="113" width="8" height="3" rx="1.5"/><rect x="117" y="113" width="8" height="3" rx="1.5"/><rect x="35" y="118" width="70" height="3" rx="1.5"/></g>
    </svg>
    <form id="nameForm" novalidate>
      <div class="names">
        <div class="field">
          <label for="nom">Nom&nbsp;:</label>
          <input id="nom" type="text" autocomplete="off" maxlength="40">
        </div>
        <div class="field">
          <label for="prenom">Prénom&nbsp;:</label>
          <input id="prenom" type="text" autocomplete="off" maxlength="40">
        </div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="foot"><button class="go blue" type="submit">Commencer</button></div>
    </form>
  </section>

  <section id="quiz" hidden>
    <div class="progress">
      <div class="progress-row"><span id="count">Question 1 sur 20</span><span id="pct">0 %</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barwrap"><i id="bar"></i></div>
    </div>
    <form class="card" id="card" onsubmit="return false"></form>
  </section>

  <section id="result" class="card result" hidden>
    <span class="tag">Résultat</span>
    <div class="top">
      <span class="emoji" id="emoji" aria-hidden="true"></span>
      <p class="rname" id="rname"></p>
    </div>
    <div class="stats">
      <div class="stat good"><span>Réponses correctes</span><b id="nGood">0</b></div>
      <div class="stat bad"><span>Réponses fausses</span><b id="nBad">0</b></div>
      <div class="stat final"><span>Note finale</span><b id="note"></b></div>
    </div>
    <p id="msg"></p>
    <h2 class="revtitle">Correction détaillée</h2>
    <ol class="rev" id="rev"></ol>
    <div class="foot"><button class="go" type="button" id="again">Recommencer</button></div>
  </section>
</div>

<script>
function one(s, q, o, a, fx) { var r = {s: s, t: "one", q: q, o: o, a: a}; if (fx) r.fixed = 1; return r; }
function many(s, q, o, a) { return {s: s, t: "multi", q: q, o: o, a: a}; }
var VF = ["Vrai", "Faux"];
var CATS = ["Périphériques d'entrée", "Périphériques de sortie", "Supports de stockage"];
var CAT = ["Périphérique d'entrée", "Périphérique de sortie", "Support de stockage"];
var S1 = "Q1 · Supports de stockage", S2 = "Q2 · Reconnaître un support", S3 = "Q3 · Définitions",
    S4 = "Q4 · Vrai ou faux", S5 = "Q5 · Périphériques d'entrée", S6 = "Q6 · Périphériques de sortie",
    S7 = "Q7 · Type d'information", S8 = "Q8 · Classement";

var Q = [
  [ many(S1, "Coche les objets qui enregistrent tes fichiers, même quand l'ordinateur est éteint.", ["Souris","Carte mémoire","Webcam","Clé USB","Haut-parleurs"], ["Carte mémoire","Clé USB"]),
    many(S1, "Quels objets servent à enregistrer des fichiers ?", ["Disque dur externe","Clavier","CD-ROM","Microphone","Écran","DVD-ROM"], ["Disque dur externe","CD-ROM","DVD-ROM"]) ],
  [ many(S1, "Quels objets ressemblent à un disque rond ? Tu les mets dans le lecteur de l'ordinateur.", ["CD-ROM","Clé USB","DVD-ROM","Carte mémoire","Souris"], ["CD-ROM","DVD-ROM"]),
    many(S1, "Quels objets sont très petits et peuvent enregistrer tes photos ?", ["Clé USB","Carte mémoire","DVD-ROM","Écran","Clavier"], ["Clé USB","Carte mémoire"]) ],
  [ one(S2, "Un CD-ROM sert à…", ["enregistrer des fichiers","écrire du texte","imprimer","afficher des images"], "enregistrer des fichiers"),
    one(S2, "La carte mémoire sert à…", ["enregistrer des fichiers","imprimer","écrire du texte","faire entendre du son"], "enregistrer des fichiers") ],
  [ one(S2, "Quel appareil peut enregistrer des photos comme une clé USB ?", ["Téléphone portable","Microphone","Souris","Haut-parleurs"], "Téléphone portable"),
    one(S2, "Quel objet te permet de prendre tes fichiers avec toi, d'un ordinateur à un autre ?", ["Clé USB","Écran","Casque audio","Imprimante"], "Clé USB") ],
  [ one(S2, "Où peut-on enregistrer un film ?", ["Sur un disque dur externe","Sur un écran","Sur une souris","Sur un clavier"], "Sur un disque dur externe"),

var TIME = 60, timerId = null, deadline = 0, tBox, tNum, tArc, tHand;
var CIRC = 2 * Math.PI * 30;
var CLOCK_SVG = (function () {
  var t = "";
  for (var k = 0; k < 12; k++) {
    t += '<line x1="50" y1="' + (k % 3 === 0 ? 6 : 9) + '" x2="50" y2="13" transform="rotate(' + (k * 30) + ' 50 50)"/>';
  }
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
    '<circle class="face" cx="50" cy="50" r="47"/>' +
    '<g class="ticks">' + t + '</g>' +
    '<circle class="track" cx="50" cy="50" r="30" fill="none" stroke-width="9"/>' +
    '<circle class="arc" cx="50" cy="50" r="30" fill="none" stroke-width="9" transform="rotate(-90 50 50)" stroke-dasharray="' + CIRC.toFixed(2) + ' ' + CIRC.toFixed(2) + '" stroke-dashoffset="0"/>' +
    '<line class="hand" x1="50" y1="50" x2="50" y2="15"/>' +
    '<circle class="pin" cx="50" cy="50" r="4"/></svg>';
})();
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function tick() {
  var left = Math.max(0, deadline - Date.now());
  var sec = Math.ceil(left / 1000);
  var elapsed = 1 - left / (TIME * 1000);
  tNum.textContent = sec + " s";
  tArc.setAttribute("stroke-dasharray", ((1 - elapsed) * CIRC).toFixed(2) + " " + CIRC.toFixed(2));
  tArc.setAttribute("stroke-dashoffset", (-elapsed * CIRC).toFixed(2));
  tHand.setAttribute("transform", "rotate(" + (elapsed * 360).toFixed(1) + " 50 50)");
  tBox.classList.toggle("low", sec <= 10);
  if (left <= 0) { stopTimer(); next(true); }
}
function startTimer() {
  stopTimer();
  deadline = Date.now() + TIME * 1000;
  tick();
  timerId = setInterval(tick, 100);
}

var qs, i, picks, sel, student = "";
var $ = function (id) { return document.getElementById(id); };
var card = $("card"), nextBtn;

function shuffle(a) {
  for (var k = a.length - 1; k > 0; k--) {
    var j = Math.floor(Math.random() * (k + 1));
    var t = a[k]; a[k] = a[j]; a[j] = t;
  }
  return a;
}
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function cap(s) {
  return s.replace(/\s+/g, " ").trim();
}

function explorer() {
  var box = el("div", "explorer");
  box.appendChild(el("div", "titlebar", "Nouveau dossier"));
  box.appendChild(el("div", "addr", "C:\\Documents and Settings\\mustapha\\Mes documents\\Nouveau dossier"));
  var wrap = el("div", "tbl"), t = el("table");
  var head = el("tr");
  ["Nom", "Taille", "Type"].forEach(function (h) { head.appendChild(el("th", null, h)); });
  t.appendChild(head);
  FILES.forEach(function (f) {
    var r = el("tr");
    r.appendChild(el("td", null, f[0]));
    r.appendChild(el("td", "num", f[1]));
    r.appendChild(el("td", null, f[2]));
    t.appendChild(r);
  });
  wrap.appendChild(t); box.appendChild(wrap);
  return box;
}

function begin() {
  qs = Q.map(function (slot) {
    var q = slot[Math.floor(Math.random() * slot.length)];
    var c = {}; for (var k in q) c[k] = q[k];
    c.opts = q.fixed ? q.o.slice() : shuffle(q.o.slice());
    return c;
  });
  i = 0; picks = [];
  $("intro").hidden = true;
  $("result").hidden = true;
  $("quiz").hidden = false;
  $("who").textContent = "Élève : " + student;
  $("who").hidden = false;
  render();
}

function render() {
  var q = qs[i], multi = q.t === "multi";
  sel = [];
  card.innerHTML = "";
  var top = el("div", "toprow");
  top.appendChild(el("span", "tag", q.s));
  tBox = el("div", "clockbox");
  tBox.setAttribute("aria-hidden", "true");
  tNum = el("span", "tnum", TIME + " s");
  tBox.appendChild(tNum);
  var cw = el("span", "clock");
  cw.innerHTML = CLOCK_SVG;
  tBox.appendChild(cw);
  tArc = cw.querySelector(".arc"); tHand = cw.querySelector(".hand");
  top.appendChild(tBox);
  card.appendChild(top);
  var pic = el("img", "pic"); pic.src = IMGS[i % IMGS.length]; pic.alt = "";
  card.appendChild(pic);
  if (q.ctx) card.appendChild(explorer());
  var h = el("h2", "q", q.q); h.tabIndex = -1; h.id = "qtitle";
  card.appendChild(h);
  var hint = el("p", "hint");
  hint.appendChild(el("b", "on", multi ? "Plusieurs réponses possibles" : "Une seule réponse"));
  card.appendChild(hint);

  var fs = el("fieldset", "options" + (multi ? " multi" : "") + (q.sym ? " row symbol" : (q.fixed && q.o.every(function (x) { return x.length <= 10; }) ? " row" : "")));
  fs.setAttribute("aria-labelledby", "qtitle");
  q.opts.forEach(function (text) {
    var lab = el("label", "opt");
    var inp = el("input");
    inp.type = multi ? "checkbox" : "radio";
    inp.name = "ans"; inp.value = text;
    inp.addEventListener("change", function () {
      if (multi) {
        sel = Array.prototype.filter.call(fs.querySelectorAll("input"), function (x) { return x.checked; }).map(function (x) { return x.value; });
      } else { sel = [text]; }
      Array.prototype.forEach.call(fs.querySelectorAll(".opt"), function (l) {
        l.classList.toggle("on", l.querySelector("input").checked);
      });
      nextBtn.disabled = sel.length === 0;
    });
    lab.appendChild(inp);
    lab.appendChild(el("span", "mark"));
    lab.appendChild(el("span", "txt", text));
    fs.appendChild(lab);
  });
  card.appendChild(fs);

  var foot = el("div", "foot split");
  nextBtn = el("button", "go", i === qs.length - 1 ? "Terminer" : "Question suivante");
  nextBtn.type = "button"; nextBtn.disabled = true;
  nextBtn.addEventListener("click", function () { next(false); });
  var backBtn = el("button", "ghost", "Retour à l'accueil");
  backBtn.type = "button";
  backBtn.addEventListener("click", function () {
    if (!backBtn.dataset.sure) {
      backBtn.dataset.sure = "1";
      backBtn.textContent = "Confirmer le retour ?";
      setTimeout(function () { delete backBtn.dataset.sure; backBtn.textContent = "Retour à l'accueil"; }, 4000);
      return;
    }
    home();
  });
  foot.appendChild(backBtn);
  foot.appendChild(nextBtn);
  card.appendChild(foot);

  var total = qs.length, p = Math.round(i / total * 100);
  $("count").textContent = "Question " + (i + 1) + " sur " + total;
  $("pct").textContent = p + " %";
  $("bar").style.width = p + "%";
  $("barwrap").setAttribute("aria-valuenow", p);
  startTimer();
  if (i > 0) { try { h.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); } catch (e) {} }
}

function next(force) {
  if (!force && !sel.length) return;
  stopTimer();
  picks[i] = sel.slice();
  if (i < qs.length - 1) { i++; render(); } else { finish(); }
}

function finish() {
  stopTimer();
  var good = 0, rev = $("rev"); rev.innerHTML = "";
  qs.forEach(function (q, n) {
    var ans = Array.isArray(q.a) ? q.a : [q.a], got = picks[n] || [];
    var ok = ans.length === got.length && ans.every(function (g) { return got.indexOf(g) > -1; });
    if (ok) good++;
    var li = el("li", ok ? "ok" : "ko");
    li.appendChild(el("div", "rq", (n + 1) + ". " + q.q));
    var l1 = el("div", "line");
    l1.appendChild(el("span", "lab", "Ta réponse"));
    l1.appendChild(el("span", ok ? "good" : "bad", (ok ? "✓ " : "✗ ") + (got.length ? got.join(" · ") : "Aucune réponse")));
    li.appendChild(l1);
    if (!ok) {
      var l2 = el("div", "line");
      l2.appendChild(el("span", "lab", "Bonne réponse"));
      l2.appendChild(el("span", "good", "✓ " + ans.join(" · ")));
      li.appendChild(l2);
    }
    rev.appendChild(li);
  });
  var total = qs.length, bad = total - good;
  var note = good * 10 / total;
  var noteTxt = (Math.round(note * 100) / 100).toString().replace(".", ",");

  var emoji, msg;
  if (note > 8) { emoji = "😄"; msg = "Félicitations, excellent résultat !"; }
  else if (note < 7) { emoji = "😞"; msg = "Résultat insuffisant. Révise le cours puis recommence le quiz."; }
  else { emoji = "😐"; msg = "Résultat moyen. Encore un petit effort pour progresser."; }

  $("quiz").hidden = true;
  $("emoji").textContent = emoji;
  $("rname").textContent = student;
  $("nGood").textContent = good;
  $("nBad").textContent = bad;
  var n = $("note"); n.textContent = "";
  n.appendChild(document.createTextNode(noteTxt + " "));
  n.appendChild(el("small", null, "/ 10"));
  $("msg").textContent = msg;
  $("result").hidden = false;
  try { window.scrollTo({ top: 0 }); } catch (e) {}
}

$("nameForm").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var p = cap($("prenom").value), n = cap($("nom").value);
  if (!p || !n) {
    $("err").textContent = !p && !n ? "Écris ton nom et ton prénom pour commencer."
      : !n ? "Écris ton nom pour commencer." : "Écris ton prénom pour commencer.";
    (!n ? $("nom") : $("prenom")).focus();
    return;
  }
  $("err").textContent = "";
  try {
    var de = document.documentElement, rf = de.requestFullscreen || de.webkitRequestFullscreen;
    if (rf && !document.fullscreenElement && !document.webkitFullscreenElement) {
      var pr = rf.call(de); if (pr && pr.catch) pr.catch(function () {});
    }
  } catch (e) {}
  student = n + " " + p;
  begin();
});

function home() {
  stopTimer();
  $("quiz").hidden = true;
  $("result").hidden = true;
  $("who").hidden = true;
  $("nom").value = ""; $("prenom").value = "";
  $("err").textContent = "";
  $("intro").hidden = false;
  try { window.scrollTo({ top: 0 }); } catch (e) {}
}
$("again").addEventListener("click", home);
</script>

</body></html>
